# Foot Shop — production nginx (HTTPS)
# Apply: bash scripts/vps/apply-nginx.sh

server {
    listen 80;
    listen [::]:80;
    server_name foot-shop.fr www.foot-shop.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name foot-shop.fr www.foot-shop.fr;

    ssl_certificate /etc/letsencrypt/live/foot-shop.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foot-shop.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Serve Next.js build assets from disk.
  # Fixes 400 errors on CSS/JS chunks (incl. dynamic routes like produit/[id]).
  # Do NOT proxy /_next/static/ to Node — Next.js/nginx can reject those URLs.
    location /_next/static/ {
        alias /var/www/foot-shop/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
